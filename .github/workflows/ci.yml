name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 内容仓库：公开仓库不需要 token；私有仓库需要 secrets.CONTENT_REPO_TOKEN
      - name: Build
        env:
          CONTENT_REPO_URL: ${{ vars.CONTENT_REPO_URL }}
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
          CONTENT_REPO_SLUG: ${{ vars.CONTENT_REPO_SLUG }}
        run: pnpm build
