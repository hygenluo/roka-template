<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="芦苇">
  <!-- 纸面 -->
  <rect width="64" height="64" fill="#F8F5ED"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" fill="none" stroke="#2B2833" stroke-width="1.5"/>

  <!-- 苇秆：一条略带弧度的茎 -->
  <path d="M30 56 C30 44 29 34 27 24" fill="none" stroke="#2B2833" stroke-width="2.4" stroke-linecap="round"/>
  <!-- 叶：斜出的一笔 -->
  <path d="M30 44 C36 42 40 38 42 33" fill="none" stroke="#2B2833" stroke-width="1.8" stroke-linecap="round"/>

  <!-- 芦花：花穗 -->
  <path d="M27 24 C26 18 28 13 31 10" fill="none" stroke="#C9B48E" stroke-width="2" stroke-linecap="round"/>
  <circle cx="27" cy="22" r="2.6" fill="#C9B48E"/>
  <circle cx="31" cy="17" r="2.2" fill="#C9B48E"/>
  <circle cx="29" cy="11.5" r="1.8" fill="#C9B48E"/>

  <!-- 被风吹走的两粒絮 -->
  <circle cx="41" cy="14" r="1.6" fill="#6FA8CE" opacity="0.9"/>
  <circle cx="48" cy="20" r="1.3" fill="#6FA8CE" opacity="0.7"/>
</svg>
