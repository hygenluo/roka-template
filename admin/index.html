<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理</title>
    <!--
      路径必须写绝对路径。站点启用了 drop-trailing-slash，页面地址是 /admin（没有尾斜杠），
      相对路径 ./vendor/x.js 会被解析成 /vendor/x.js，直接 404。
    -->
    <link rel="cms-config-url" type="text/yaml" href="/admin/config.yml" />
    <style>
      html, body { height: 100%; margin: 0; }
      body { font: 14px/1.6 system-ui, sans-serif; background: #f5f6f3; color: #15181b;
             display: grid; place-items: center; }
      .boot { text-align: center; color: #62676b; }
      .boot b { display: block; color: #15181b; font-weight: 500; margin-bottom: 4px; }
    </style>
  </head>
  <body data-pagefind-ignore>
    <div class="boot">
      <b>正在加载编辑器…</b>
      一直停在这里的话：多半是 vendor/decap-cms.js 或 config.yml 没同步过去
    </div>

    <!-- Decap CMS 自托管：不走任何外部 CDN，国内也能直接打开 -->
    <script src="/admin/vendor/decap-cms.js"></script>
    <script>
      // 保存后给一句实话：构建要时间，不是没存上
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.CMS) {
          document.querySelector('.boot').innerHTML =
            '<b>编辑器没加载出来</b>vendor/decap-cms.js 缺失，重新构建一次';
          return;
        }
        window.CMS.registerEventListener({
          name: 'postSave',
          handler: ({ entry }) => {
            const slug = entry?.get?.('slug') || '';
            console.info('[decap] 已提交到内容仓库', slug);
            // 保存 ≠ 上线：给一个明确的等待提示
            const tip = document.createElement('div');
            tip.textContent = '已提交到内容仓库，约 1–2 分钟后线上生效';
            tip.style.cssText =
              'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);' +
              'background:#15181b;color:#f5f6f3;padding:8px 16px;font-size:13px;z-index:9999';
            document.body.appendChild(tip);
            setTimeout(() => tip.remove(), 6000);
          },
        });
      });
    </script>
  </body>
</html>
