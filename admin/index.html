<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { font: 14px/1.6 system-ui, sans-serif; background: #f5f6f3; color: #15181b;
             display: grid; place-items: center; }
      .boot { text-align: center; color: #62676b; }
      .boot b { display: block; color: #15181b; font-weight: 500; margin-bottom: 4px; }
    </style>
  </head>
  <body data-pagefind-ignore>
    <div class="boot">
      <b>正在加载编辑器…</b>
      如果一直停在这里，多半是 config.yml 没生成（构建前置脚本没跑）
    </div>

    <!-- Decap CMS：纯静态，直接写你内容仓库的 git -->
    <script src="https://unpkg.com/decap-cms@^3.17.0/dist/decap-cms.js"></script>
    <script>
      // 保存后给一句实话：构建要时间，不是没存上
      document.addEventListener('DOMContentLoaded', () => {
        if (!window.CMS) return;
        window.CMS.registerEventListener({
          name: 'postSave',
          handler: ({ entry }) => {
            const slug = entry?.get?.('slug') || '';
            console.info('[decap] 已提交到内容仓库', slug);
          },
        });
      });
    </script>
  </body>
</html>
